// Shared, root-local publishing credential access.  This file is intentionally
// read only by publishing tasks; normal configuration and compilation never
// require credentials.
def cltPublishingRoot = new File(project.property('cltRepositoryRoot').toString())
def cltApiPropertiesFile = new File(cltPublishingRoot, 'api.properties')

ext.cltReadPublishingCredentials = {
    Properties properties = new Properties()
    if (cltApiPropertiesFile.isFile()) {
        cltApiPropertiesFile.withInputStream { properties.load(it) }
    }
    properties
}

ext.cltPublishingCredentialsPresent = { cltApiPropertiesFile.isFile() }
