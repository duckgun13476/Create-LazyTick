// CreateLazyTick publish mission

def cltResolvePublishingRepositoryRoot = {
    File current = project.projectDir
    while (current != null) {
        if (new File(current, 'gradle/clt-common.properties').exists()) {
            return current
        }
        current = current.parentFile
    }
    return rootProject.projectDir
}

def cltPublishingRepositoryRootDir = cltResolvePublishingRepositoryRoot()

ext.cltReadPublishingProperties = {
    def propertiesFile = new File(cltPublishingRepositoryRootDir, 'api.properties')
    if (!propertiesFile.exists()) {
        return null
    }

    def properties = new Properties()
    properties.load(new FileInputStream(propertiesFile))
    return properties
}

ext.cltReadPrimaryChangelog = {
    def changelogFile = new File(cltPublishingRepositoryRootDir, 'update/changelog.md')
    if (!changelogFile.exists()) {
        return ''
    }
    String text = changelogFile.getText('UTF-8')
    def matcher = text =~ /(?ms)\A(####\s+v[^\n]+.*?)(?=\n####\s+v|\z)/
    return matcher.find() ? matcher.group(1).trim() : text.trim()
}

ext.cltReadFullChangelog = {
    def changelogFile = new File(cltPublishingRepositoryRootDir, 'update/changelog.md')
    return changelogFile.exists() ? changelogFile.getText('UTF-8') : ''
}

ext.cltReadStringListProperty = { String name, List<String> defaultValue = [] ->
    def value = project.findProperty(name)
    if (value == null) {
        return defaultValue
    }
    if (value instanceof Collection) {
        return value.collect { it.toString().trim() }.findAll { !it.isEmpty() }
    }
    return value.toString()
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
}

ext.cltReadBooleanProperty = { String name, boolean defaultValue = false ->
    def value = project.findProperty(name)
    if (value == null) {
        return defaultValue
    }
    String normalized = value.toString().trim().toLowerCase(Locale.ROOT)
    if (normalized in ['1', 'true', 'yes', 'y', 'on']) {
        return true
    }
    if (normalized in ['0', 'false', 'no', 'n', 'off']) {
        return false
    }
    return defaultValue
}

ext.cltPublishRemoteCheckEnabled = {
    return !cltReadBooleanProperty('clt_publish_remote_check_disabled', false)
}

ext.cltPublishCurseForgeRemoteCheckEnabled = {
    return cltPublishRemoteCheckEnabled() && !cltReadBooleanProperty('clt_publish_curseforge_remote_check_disabled', false)
}

ext.cltPublishModrinthRemoteCheckEnabled = {
    return cltPublishRemoteCheckEnabled() && !cltReadBooleanProperty('clt_publish_modrinth_remote_check_disabled', false)
}

ext.cltReadPublishArtifactTaskName = {
    return project.findProperty('clt_publish_artifact_task_name')?.toString()?.trim() ?: 'jar'
}

ext.cltReadPublishLoaderId = {
    return project.findProperty('clt_publish_loader_id')?.toString()?.trim() ?: ''
}

ext.cltReadPublishDisplaySuffix = {
    def configuredSuffix = project.findProperty('clt_publish_display_suffix')?.toString()?.trim()
    if (configuredSuffix != null && !configuredSuffix.isEmpty()) {
        return configuredSuffix.startsWith('_') ? configuredSuffix : "_${configuredSuffix}"
    }

    return ''
}

ext.cltReadPublishVersionSuffix = {
    def configuredSuffix = project.findProperty('clt_publish_version_suffix')?.toString()?.trim()
    if (configuredSuffix != null && !configuredSuffix.isEmpty()) {
        return configuredSuffix.startsWith('-') ? configuredSuffix : "-${configuredSuffix}"
    }

    return ''
}

ext.cltReadPublishDisplayName = {
