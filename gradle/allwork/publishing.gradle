ext.cltReadCurseForgeUploadVersionIds = {
    // The legacy upload endpoint expects gameVersionId values, not Core API ids.
    Map<String, Long> minecraftVersionIds = [
            '1.19.2': 9366L,
            '1.20.1': 9990L,
            '1.21.1': 11779L
    ]
    Map<String, Long> loaderVersionIds = [
            'fabric'  : 7499L,
            'forge'   : 7498L,
            'neoforge': 10150L,
            'quilt'   : 9153L
    ]
    List<Long> versionIds = []
    Long minecraftVersionId = minecraftVersionIds[minecraft_version.toString()]
    if (minecraftVersionId == null) {
        throw new GradleException("No CurseForge upload gameVersionId mapping for Minecraft ${minecraft_version} in ${project.path}")
    }
    versionIds.add(minecraftVersionId)

    cltReadPublishCurseForgeLoaders().each { loaderName ->
        Long loaderVersionId = loaderVersionIds[loaderName.toString().trim().toLowerCase(Locale.ROOT)]
        if (loaderVersionId == null) {
            throw new GradleException("No CurseForge upload loader mapping for ${loaderName} in ${project.path}")
        }
        versionIds.add(loaderVersionId)
    }

    versionIds.add(9638L)
    versionIds.add(9639L)
    return versionIds.unique()
}

