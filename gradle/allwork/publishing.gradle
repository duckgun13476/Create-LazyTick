// BO-style publishing convention. Version projects declare only loader and
// artifact metadata before applying this script.
def cltCurseForgeTaskType = project.ext.cltCurseForgeTaskType
def cltResolvePublishingRepositoryRoot = {
    File current = project.projectDir
    while (current != null) {
        if (new File(current, 'gradle/clt-common.properties').isFile()) {
            return current
        }
        current = current.parentFile
    }
    return rootProject.projectDir
}

def cltPublishingRepositoryRoot = cltResolvePublishingRepositoryRoot()

ext.cltReadPublishingProperties = {
    File propertiesFile = new File(cltPublishingRepositoryRoot, 'api.properties')
    if (!propertiesFile.isFile()) {
        return null
    }
    Properties properties = new Properties()
    propertiesFile.withInputStream { properties.load(it) }
    return properties
}

ext.cltReadPrimaryChangelog = {
    File changelogFile = new File(cltPublishingRepositoryRoot, 'update/changelog.md')
    if (!changelogFile.isFile()) {
        return ''
    }
    return changelogFile.getText('UTF-8').split("\\n\\n\\n")[0]
}

ext.cltReadFullChangelog = {
    File changelogFile = new File(cltPublishingRepositoryRoot, 'update/changelog.md')
    return changelogFile.isFile() ? changelogFile.getText('UTF-8') : ''
}

ext.cltReadStringListProperty = { String name, List<String> defaultValue = [] ->
    def value = project.findProperty(name)
    if (value == null) {
        return defaultValue
    }
    if (value instanceof Collection) {
        return value.collect { it.toString().trim() }.findAll { !it.isEmpty() }
    }
    return value.toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}

ext.cltPublishArtifactTaskName = {
    return project.findProperty('clt_publish_artifact_task_name')?.toString()?.trim() ?: 'jar'
}

ext.cltPublishLoaderId = {
    return project.findProperty('clt_publish_loader_id')?.toString()?.trim() ?: ''
}

ext.cltPublishArtifactFile = {
    Task artifactTask = tasks.named(cltPublishArtifactTaskName()).get()
    if (!artifactTask.hasProperty('archiveFile')) {
        throw new GradleException("Publishing task '${artifactTask.name}' has no archiveFile in '${project.path}'")
    }
    return artifactTask.archiveFile.get().asFile
}

ext.cltVerifyPublishArtifactFile = {
    File artifact = cltPublishArtifactFile()
    if (!artifact.isFile() || artifact.length() == 0L) {
        throw new GradleException("Publishing artifact is missing or empty for '${project.path}': ${artifact.absolutePath}")
    }
    return artifact
}

ext.cltPublishDisplayName = {
    return "${display_name}_v${mod_release_version}_for_Create_v${mod_create_compat_version}"
}

ext.cltPublishVersionId = {
    return "${minecraft_version}-${mod_version}"
}

ext.cltPublishCurseForgeLoaders = {
    return cltReadStringListProperty('clt_publish_curseforge_loaders')
}

ext.cltPublishModrinthLoaders = {
    return cltReadStringListProperty('clt_publish_modrinth_loaders')
}

ext.cltPublishRequiredDependencies = {
    return cltReadStringListProperty('clt_publish_required_dependencies', ['create'])
}

ext.cltPublishOptionalDependencies = {
    return cltReadStringListProperty('clt_publish_optional_dependencies', ['jei', 'observable'])
}

tasks.register('PublishInfo') {
    group = 'Publishing'
    doLast {
        println "Publish artifact path: ${cltPublishArtifactFile().absolutePath}"
        println "version = \"${cltPublishVersionId()}\"\n    displayName = \"${cltPublishDisplayName()}\""
        def properties = cltReadPublishingProperties()
        if (properties == null) {
            println 'api.properties not exist'
        } else {
            println "CF_TOKEN: ${properties.getProperty('CF_TOKEN') == null ? 'missing' : 'present'}"
            println "MODRINTH_TOKEN: ${properties.getProperty('MODRINTH_TOKEN') == null ? 'missing' : 'present'}"
        }
    }
}

tasks.register('publishInfo') {
    group = 'Publishing'
    description = 'Alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('allworkJarJar') {
    group = 'Allwork'
    description = 'Builds this version\'s final publishing artifact.'
    dependsOn { cltPublishArtifactTaskName() }
}

tasks.register('verifyPublishArtifact') {
    group = 'Publishing'
    description = 'Verifies that the final publishing artifact exists and is non-empty.'
    dependsOn 'allworkJarJar'
    doLast {
        File artifact = cltVerifyPublishArtifactFile()
        println "Verified publish artifact for ${project.path}: ${artifact.absolutePath} (${artifact.length()} bytes)"
    }
}

tasks.register('publishCurseForge', cltCurseForgeTaskType) {
    group = 'Publishing'
    dependsOn { cltPublishArtifactTaskName() }
    dependsOn 'verifyPublishArtifact'

    def properties = cltReadPublishingProperties()
    apiToken = properties?.getProperty('CF_TOKEN')
    def mainFile = upload(curseforge_id, cltPublishArtifactFile())
    mainFile.changelog = cltReadPrimaryChangelog()
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addGameVersion(minecraft_version.toString())
    cltPublishCurseForgeLoaders().each { loaderName ->
        mainFile.addModLoader(loaderName.equalsIgnoreCase('neoforge') ? 'NeoForge' : 'Forge')
    }
    cltPublishRequiredDependencies().each { mainFile.addRequirement(it) }
    cltPublishOptionalDependencies().each { mainFile.addOptional(it) }
    mainFile.displayName = cltPublishDisplayName()
    mainFile.releaseType = publish_version
    disableVersionDetection()
}

publishMods {
    def properties = cltReadPublishingProperties()
    file = cltPublishArtifactFile()
    changelog = cltReadFullChangelog()
    type = STABLE
    version = cltPublishVersionId()
    displayName = cltPublishDisplayName()

    cltPublishModrinthLoaders().each { loaderName -> modLoaders.add(loaderName) }
    String token = properties?.getProperty('MODRINTH_TOKEN')
    if (token != null && !token.trim().isEmpty()) {
        modrinth {
            accessToken = token
            projectId = modrinth_id.toString()
            minecraftVersions.add(minecraft_version)
            cltPublishRequiredDependencies().each { requires(it) }
            cltPublishOptionalDependencies().each { optional(it) }
        }
    }
}

tasks.matching { it.name in ['publishMods', 'publishModrinth'] }.configureEach {
    dependsOn { cltPublishArtifactTaskName() }
    dependsOn 'verifyPublishArtifact'
}

tasks.register('publishAll') {
    group = 'Publishing'
    dependsOn 'publishCurseForge'
    dependsOn 'publishMods'
    dependsOn 'verifyPublishArtifact'
}

tasks.register('allworkPublishInfo') {
    group = 'Allwork'
    description = 'Allwork alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('allworkPublishAll') {
    group = 'Allwork'
    description = 'Allwork alias for publishAll.'
    dependsOn 'publishAll'
}
