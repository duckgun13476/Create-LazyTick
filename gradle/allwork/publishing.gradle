ext.cltWriteMultipartTextPart = { OutputStream output, String boundary, String name, String content, String contentType ->
    output.write("--${boundary}\r\n".getBytes('UTF-8'))
    output.write("Content-Disposition: form-data; name=\"${name}\"\r\n".getBytes('UTF-8'))
    output.write("Content-Type: ${contentType}\r\n\r\n".getBytes('UTF-8'))
    output.write(content.getBytes('UTF-8'))
    output.write("\r\n".getBytes('UTF-8'))
}

ext.cltWriteMultipartFilePart = { OutputStream output, String boundary, String name, File file ->
    output.write("--${boundary}\r\n".getBytes('UTF-8'))
    output.write("Content-Disposition: form-data; name=\"${name}\"; filename=\"${file.name}\"\r\n".getBytes('UTF-8'))
    output.write("Content-Type: application/java-archive\r\n\r\n".getBytes('UTF-8'))
    file.withInputStream { InputStream input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) > 0) {
            output.write(buffer, 0, read)
        }
    }
    output.write("\r\n".getBytes('UTF-8'))
}

ext.cltUploadCurseForgeFile = {
    String token = cltReadCurseForgeUploadApiToken()
    if (token == null || token.trim().isEmpty()) {
        throw new GradleException("Missing CF_TOKEN for CurseForge upload in ${project.path}")
    }

    File artifactFile = cltVerifyPublishArtifactFile()
    String endpoint = cltReadCurseForgeUploadEndpoint()
    String uploadUrl = "${endpoint}/api/projects/${cltUrlEncode(curseforge_id.toString())}/upload-file"
    String boundary = "clt-cf-${System.currentTimeMillis()}-${Math.abs(new Random().nextInt())}"
    HttpURLConnection connection = (HttpURLConnection) URI.create(uploadUrl).toURL().openConnection()
    connection.setRequestMethod('POST')
    connection.setConnectTimeout(cltPublishHttpTimeoutMillis())
    connection.setReadTimeout(Math.max(cltPublishHttpTimeoutMillis(), 180000))
    connection.setDoOutput(true)
    connection.setRequestProperty('X-Api-Token', token.trim())
    connection.setRequestProperty('User-Agent', cltPublishUserAgent())
    connection.setRequestProperty('Content-Type', "multipart/form-data; boundary=${boundary}")

    connection.outputStream.withCloseable { OutputStream output ->
        cltWriteMultipartTextPart(output, boundary, 'metadata', JsonOutput.toJson(cltReadCurseForgeUploadMetadata()), 'application/json; charset=UTF-8')
        cltWriteMultipartFilePart(output, boundary, 'file', artifactFile)
        output.write("--${boundary}--\r\n".getBytes('UTF-8'))
    }

    int responseCode = connection.getResponseCode()
    InputStream stream = responseCode >= 400 ? connection.getErrorStream() : connection.getInputStream()
    String body = stream == null ? '' : stream.getText('UTF-8')
    if (responseCode < 200 || responseCode >= 300) {
        String bodySummary = body == null ? '' : body.replaceAll(/\s+/, ' ').take(500)
        throw new GradleException("CurseForge upload failed for ${project.path}: POST ${uploadUrl} returned HTTP ${responseCode}${bodySummary.isEmpty() ? '' : " (${bodySummary})"}")
    }
    return body.trim().isEmpty() ? [:] : new JsonSlurper().parseText(body)
}

tasks.register('PublishInfo') {
    group = 'Publishing'

    doLast {
        println "Publish artifact path: ${cltReadPublishArtifactFile().absolutePath}"
        println "version = \"${cltReadPublishVersionId()}\"\n" +
                "    displayName = \"${cltReadPublishDisplayName()}\""
        def properties = cltReadPublishingProperties()
        if (properties != null) {
            println "CF_TOKEN: ${properties.getProperty('CF_TOKEN') == null ? 'missing' : 'present'}"
            println "CurseForge Core API key source: ${cltReadCurseForgeApiKeySource() ?: 'missing'}"
            println "MODRINTH_TOKEN: ${properties.getProperty('MODRINTH_TOKEN') == null ? 'missing' : 'present'}"
        } else {
            println "api.properties not exist"
        }
    }
}

tasks.register('checkCurseForgePublishStatus') {
    group = 'Publishing'
    description = 'Checks CurseForge for an existing file matching this publish target.'

    doLast {
        boolean exists = cltCheckCurseForgePublished()
        if (cltPublishRemoteStatus.curseforgeLedgerIgnored) {
            println "CurseForge publish ledger ignored for ${project.path} because -Pclt_publish_force=true was set."
        } else if (cltPublishRemoteStatus.curseforgeLedgerMatch) {
            def match = cltPublishRemoteStatus.curseforgeLedgerMatch
            println "CurseForge local ledger has successful upload for ${project.path}; skipping upload. version=${match.versionId} loader=${match.loader} source=${match.source ?: 'ledger'}"
        } else if (cltPublishRemoteStatus.curseforgeCheckDisabled) {
            println "CurseForge remote publish check disabled for ${project.path}; no successful local ledger entry found, so upload will be attempted."
        } else if (cltPublishRemoteStatus.curseforgeRemoteUnknown) {
            println "CurseForge remote publish check is unavailable for ${project.path}; no successful local ledger entry found, so upload will be attempted. reason=${cltPublishRemoteStatus.curseforgeRemoteCheckError ?: 'unknown'}"
        } else if (exists) {
            def match = (cltPublishRemoteStatus.curseforgeMatches ?: [[:]])[0]
            println "CurseForge already has ${project.path} target; skipping upload if requested. id=${match.id ?: 'unknown'} displayName=${match.displayName ?: 'unknown'} fileName=${match.fileName ?: 'unknown'} fileStatus=${match.fileStatus ?: 'unknown'}"
        } else {
            println "CurseForge does not have ${project.path} target: displayName=${cltReadPublishDisplayName()} fileName=${cltReadPublishArtifactFile().name}"
        }
    }
}

tasks.register('checkModrinthPublishStatus') {
    group = 'Publishing'
    description = 'Checks Modrinth for an existing version matching this publish target.'

    doLast {
        boolean exists = cltCheckModrinthPublished()
        if (cltPublishRemoteStatus.modrinthCheckDisabled) {
            println "Modrinth remote publish check disabled for ${project.path}; upload task will not be skipped by remote status."
        } else if (exists) {
            def match = cltPublishRemoteStatus.modrinthMatch ?: [:]
            println "Modrinth already has ${project.path} target; skipping upload if requested. id=${match.id ?: 'unknown'} version=${match.version_number ?: cltReadPublishVersionId()} status=${match.status ?: 'unknown'}"
        } else {
            println "Modrinth does not have ${project.path} target: version=${cltReadPublishVersionId()}"
        }
    }
}

tasks.register('checkPublishRemoteStatus') {
    group = 'Publishing'
    description = 'Checks remote publishing platforms for existing targets before upload.'
    dependsOn 'checkCurseForgePublishStatus'
    dependsOn 'checkModrinthPublishStatus'
}

tasks.register('publishInfo') {
    group = 'Publishing'
    description = 'Alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('publishAll') {
    dependsOn 'publishCurseForge'
    dependsOn 'publishMods'
    dependsOn 'checkPublishRemoteStatus'
    dependsOn 'verifyPublishArtifact'
    group = 'Publishing'
}

tasks.register('allworkPublishInfo') {
    group = 'Allwork'
    description = 'Allwork alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('allworkPublishAll') {
    group = 'Allwork'
    description = 'Allwork alias for publishAll.'
    dependsOn 'publishAll'
}

tasks.register('allworkJarJar') {
    group = 'Allwork'
    description = 'Allwork alias for the configured final publish artifact task.'
    dependsOn cltReadPublishArtifactTaskName()
}

tasks.register('verifyPublishArtifact') {
    group = 'Publishing'
    description = 'Verify that the configured final publish artifact exists before uploading.'
    dependsOn cltReadPublishArtifactTaskName()

    doLast {
        File artifactFile = cltVerifyPublishArtifactFile()
        println "Verified publish artifact for ${project.path}: ${artifactFile.absolutePath} (${artifactFile.length()} bytes)"
    }
}

tasks.register('publishCurseForge') {
    dependsOn cltReadPublishArtifactTaskName()
    dependsOn 'verifyPublishArtifact'
    dependsOn 'checkCurseForgePublishStatus'

    onlyIf {
        boolean exists = cltPublishRemoteStatus.containsKey('curseforgeExists')
                ? (cltPublishRemoteStatus.curseforgeExists as boolean)
                : cltCheckCurseForgePublished()
        if (exists) {
            println "Skipping CurseForge upload for ${project.path}: successful local ledger or remote target already exists. Use -Pclt_publish_force=true to upload anyway."
            return false
        }
        return true
    }

    doLast {
        def response = cltUploadCurseForgeFile()
        cltWritePublishLedgerSuccessEntry('curseforge', [
                source: 'direct-curseforge-upload',
                fileId: response instanceof Map ? response.id : null
        ])
    }
}

publishMods {
    def properties = cltReadPublishingProperties()
    def modrinthTokenGet = properties?.getProperty('MODRINTH_TOKEN')

    file = cltReadPublishArtifactFile()
    changelog = cltReadFullChangelog()
    type = STABLE
    version = cltReadPublishVersionId()
    displayName = cltReadPublishDisplayName()

    cltReadPublishModrinthLoaders().each { loaderName ->
        modLoaders.add(loaderName)
    }

    if (modrinthTokenGet != null) {
        modrinth {
            accessToken = modrinthTokenGet
            projectId = "${modrinth_id}"
            minecraftVersions.add(minecraft_version)
            cltReadPublishRequiredDependencies().each { dependencyId ->
                requires(dependencyId)
            }
            cltReadPublishOptionalDependencies().each { dependencyId ->
                optional(dependencyId)
            }
        }
    }
}

tasks.matching { it.name in ['publishMods', 'publishModrinth'] }.configureEach {
    dependsOn cltReadPublishArtifactTaskName()
    dependsOn 'verifyPublishArtifact'
    dependsOn 'checkModrinthPublishStatus'

    onlyIf {
        boolean exists = cltPublishRemoteStatus.containsKey('modrinthExists')
                ? (cltPublishRemoteStatus.modrinthExists as boolean)
                : cltCheckModrinthPublished()
        if (exists) {
            println "Skipping Modrinth upload for ${project.path}: remote target already exists. Use -Pclt_publish_force=true to upload anyway."
            return false
        }
        return true
    }
}
