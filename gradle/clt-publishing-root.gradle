// CSC-style root orchestration. This script never reads credentials; individual
// publish tasks retain their loader-specific upload configuration.
def cltPublishableProjects = [
        ':forge-1.19.2',
        ':forge-1.20.1-0.5.1',
        ':forge-1.20.1-6.0.x',
        ':neoforge-1.21.1'
]

gradle.projectsEvaluated {
    Task previousPublishTask = null
    cltPublishableProjects.collect { rootProject.project(it) }.each { targetProject ->
        Task publishTask = targetProject.tasks.findByName('allworkPublishAll')
        if (publishTask != null && previousPublishTask != null) {
            publishTask.mustRunAfter(previousPublishTask)
        }
        if (publishTask != null) {
            previousPublishTask = publishTask
        }
    }
}

tasks.register('packageAllVersions') {
    group = 'publishing'
    description = 'Builds loader-correct release artifacts for all CreateLazyTick versions.'
    dependsOn(cltPublishableProjects.collect { "${it}:allworkJarJar" })
}

tasks.register('publishInfoAllVersions') {
    group = 'publishing'
    description = 'Prints per-version publishing information without uploading artifacts.'
    dependsOn(cltPublishableProjects.collect { "${it}:allworkPublishInfo" })
}

tasks.register('publishAllVersions') {
    group = 'publishing'
    description = 'Packages and publishes every CreateLazyTick version in a stable order.'
    dependsOn('packageAllVersions')
    dependsOn(cltPublishableProjects.collect { "${it}:allworkPublishAll" })
}

tasks.register('verifyPublishArtifactsAllVersions') {
    group = 'verification'
    description = 'Verifies every loader-correct release artifact without uploading.'
    dependsOn(cltPublishableProjects.collect { "${it}:verifyPublishArtifact" })
}
