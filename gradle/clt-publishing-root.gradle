// CSC-style root orchestration. This script never reads credentials; individual
// publish tasks retain their loader-specific upload configuration.
def cltPublishableProjects = [
        ':forge-1.19.2',
        ':forge-1.20.1-0.5.1',
        ':forge-1.20.1-6.0.x',
        ':neoforge-1.21.1'
]

gradle.projectsEvaluated {
    Task previousCurseForgeTask = null
    Task previousModrinthTask = null
    cltPublishableProjects.collect { rootProject.project(it) }.each { targetProject ->
        Task curseForgeTask = targetProject.tasks.findByName('publishCurseForge')
        Task modrinthTask = targetProject.tasks.findByName('publishModrinth')
        Task publishModsTask = targetProject.tasks.findByName('publishMods')
        if (curseForgeTask != null) {
            if (previousCurseForgeTask != null) curseForgeTask.mustRunAfter(previousCurseForgeTask)
            if (previousModrinthTask != null) curseForgeTask.mustRunAfter(previousModrinthTask)
        }
        if (modrinthTask != null) {
            if (curseForgeTask != null) modrinthTask.mustRunAfter(curseForgeTask)
            if (previousCurseForgeTask != null) modrinthTask.mustRunAfter(previousCurseForgeTask)
            if (previousModrinthTask != null) modrinthTask.mustRunAfter(previousModrinthTask)
        }
        if (publishModsTask != null && modrinthTask != null) publishModsTask.mustRunAfter(modrinthTask)
        if (curseForgeTask != null) previousCurseForgeTask = curseForgeTask
        if (modrinthTask != null) previousModrinthTask = modrinthTask
    }
}

tasks.register('allworkPublishInfoAllVersions') {
    group = 'Allwork'
    description = 'Prints publishing information for all CreateLazyTick versions.'
    dependsOn(cltPublishableProjects.collect { "${it}:allworkPublishInfo" })
}

tasks.register('publishInfoAllVersions') {
    group = 'Publishing'
    description = 'Alias for allworkPublishInfoAllVersions.'
    dependsOn 'allworkPublishInfoAllVersions'
}

tasks.register('allworkPackageAllVersions') {
    group = 'Allwork'
    description = 'Builds and verifies final artifacts for all CreateLazyTick versions.'
    dependsOn(cltPublishableProjects.collect { "${it}:allworkJarJar" })
    dependsOn(cltPublishableProjects.collect { "${it}:verifyPublishArtifact" })
}

tasks.register('allworkJarJarAllVersions') {
    group = 'Allwork'
    description = 'Alias for allworkPackageAllVersions.'
    dependsOn 'allworkPackageAllVersions'
}

tasks.register('packageAllVersions') {
    group = 'Publishing'
    description = 'Builds and verifies final artifacts for all CreateLazyTick versions.'
    dependsOn 'allworkPackageAllVersions'
}

tasks.register('allworkPublishAllVersions') {
    group = 'Allwork'
    description = 'Publishes all CreateLazyTick versions in stable order.'
    dependsOn 'packageAllVersions'
    dependsOn(cltPublishableProjects.collect { "${it}:allworkPublishAll" })
}

tasks.register('publishAllVersions') {
    group = 'Publishing'
    description = 'Alias for allworkPublishAllVersions.'
    dependsOn 'allworkPublishAllVersions'
}

tasks.register('verifyPublishArtifactsAllVersions') {
    group = 'verification'
    description = 'Verifies every loader-correct release artifact without uploading.'
    dependsOn(cltPublishableProjects.collect { "${it}:verifyPublishArtifact" })
}
