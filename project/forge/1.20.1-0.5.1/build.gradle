processResources {
    def buildProps = project.properties.clone()

    // Replaces FML's magic file.jarVersion string with the correct version at build time.
    buildProps.put('file', [jarVersion: project.version])

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand buildProps
    }
}

compileJava {
    options.compilerArgs = ['-Xdiags:verbose']
}

jar {
    from(new File(project.property('cltRepositoryRoot').toString(), 'licenses/PolyForm-Noncommercial-1.0.0.txt')) {
        rename { "${it}_${archivesBaseName}" }

    }
    manifest.attributes([
            "MixinConfigs": "createlazytick.mixins.json",
            "Git-Hash"    :  gitHash
    ])

}

ext.clt_publish_artifact_task_name = 'reobfJar'
ext.clt_publish_loader_id = 'forge'
ext.clt_publish_curseforge_loaders = ['forge', 'neoforge']
ext.clt_publish_modrinth_loaders = ['forge', 'neoforge']
ext.clt_publish_required_dependencies = ['create']
ext.clt_publish_optional_dependencies = ['jei', 'observable']

tasks.register('legacyPublishInfo') {
    doLast {
        println "Reobfuscated JAR file path: ${reobfJar.archiveFile.get().asFile.absolutePath}"
        println "version = \"$minecraft_version-$mod_version\"\n" +
                "    displayName = \"${display_name}_v${mod_release_version}_for_Create_v${mod_create_compat_version}\""
        if (cltPublishingCredentialsPresent()) {
            println 'Publishing credentials: configured'
        } else {
            println "api.properties not exist"
        }
    }
    group = 'Publishing'
}

reobfJar {
    archiveFileName = "${package_name}-${mod_version}-forge-${minecraft_version}.jar"
}



tasks.register('legacyPublishAll') {
    dependsOn 'publishCurseForge'
    dependsOn 'publishMods'
    group = 'Publishing'
}









tasks.register('legacyPublishCurseForge', TaskPublishCurseForge) {
    dependsOn 'reobfJar'
    def properties = cltReadPublishingCredentials()

    var cfToken = properties.getProperty("CF_TOKEN")
    apiToken = cfToken

    def mainFile = upload(curseforge_id, project.file(
            "build/libs/${package_name}-${mod_version}-forge-${minecraft_version}.jar"))
    mainFile.changelog = new File(project.property('cltRepositoryRoot').toString(), 'update/changelog.md').getText('UTF-8').split("\n\n\n")[0]
    mainFile.addEnvironment("Client", "Server")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addModLoader("Forge","NeoForge")
    mainFile.addRequirement("create")


    mainFile.displayName = "${display_name}_v${mod_release_version}_for_Create_v${mod_create_compat_version}"

    mainFile.addOptional(
            "jei",
            "observable")
    mainFile.releaseType = publish_version //beta release. is alpha.
    disableVersionDetection()
}



publishMods {
    def properties = cltReadPublishingCredentials()
    def modrinthTokenGet = properties.getProperty("MODRINTH_TOKEN")

    file = reobfJar.archiveFile
    changelog = new File(project.property('cltRepositoryRoot').toString(), 'update/changelog.md').getText('UTF-8')
    type = STABLE
    version = "$minecraft_version-$mod_version"
    displayName = "${display_name}_v${mod_release_version}_for_Create_v${mod_create_compat_version}"

    modLoaders.add("forge")
    modLoaders.add("neoforge")

    var mrToken = modrinthTokenGet
    if(mrToken != null) {
        modrinth {
            accessToken = mrToken
            projectId = "${modrinth_id}"
            minecraftVersions.add(minecraft_version)
            requires("create")
            optional("jei","observable")
        }
    }
}

