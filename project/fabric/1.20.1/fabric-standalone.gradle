import net.fabricmc.loom.LoomGradlePlugin

buildscript {
    repositories {
        maven { url = 'https://plugins.gradle.org/m2/' }
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10.5'
    }
}

apply plugin: 'idea'
apply plugin: LoomGradlePlugin
apply plugin: 'me.modmuss50.mod-publish-plugin'
apply from: file('../../../gradle/clt-property-loader.gradle')

group = mod_group_id
ext.fabricReleaseVersion = clt_release_version
ext.mod_version = "${fabricReleaseVersion}-${mod_create_compat_version}"
version = mod_version
base.archivesName = "${mod_id}-fabric-1.20.1"

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://mvn.devos.one/releases' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com/' }
    maven { url = 'https://maven.jamieswhiteshirt.com/libs-release' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
    maven {
        url = 'https://jitpack.io/'
        content { includeGroupAndSubgroups('com.github') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Use Create Fabric's own Maven metadata so Loom gets all runtime dependencies.
    modImplementation "com.simibubi.create:create-fabric:${create_fabric_version}"
}

apply from: file('../../../gradle/clt-common.gradle')

loom {
    mixin.defaultRefmapName = 'createlazytick.refmap.json'
    runs {
        client { client(); runDir = 'run/client' }
        server { server(); runDir = 'run/server' }
    }
}

processResources {
    inputs.property 'mod_version', fabricReleaseVersion
    inputs.property 'create_fabric_version', mod_create_compat_version
    filesMatching('fabric.mod.json') {
        expand(mod_version: fabricReleaseVersion, create_fabric_version: mod_create_compat_version)
    }
}

tasks.named('remapJar') {
    archiveFileName = "CreateLazyTick-${fabricReleaseVersion}-${mod_create_compat_version}-fabric-1.20.1.jar"
}

ext.clt_publish_artifact_task_name = 'remapJar'
ext.clt_publish_loader_id = 'fabric'
ext.clt_publish_curseforge_loaders = ['fabric']
ext.clt_publish_modrinth_loaders = ['fabric']
ext.clt_publish_required_dependencies = ['create-fabric', 'fabric-api']
ext.clt_publish_display_suffix = 'Fabric'
ext.clt_publish_version_suffix = 'fabric'
ext.clt_publish_changelog_release_id = "v${fabricReleaseVersion}-release"

apply from: file('../../../gradle/clt-publishing-common.gradle')

tasks.register('verifyFabricRelease') {
    group = 'verification'
    description = 'Validates the Fabric release metadata and shared changelog before either platform upload.'
    dependsOn 'verifyPublishArtifact'
    doLast {
        if (publish_version.toString() != 'release'
                || cltReadPublishCurseForgeLoaders() != ['fabric']
                || cltReadPublishModrinthLoaders() != ['fabric']
                || cltReadPublishRequiredDependencies() != ['create-fabric', 'fabric-api']) {
            throw new GradleException('Fabric publishing metadata is inconsistent')
        }
        String changelog = cltReadPrimaryChangelog()
        if (changelog.readLines().first()?.trim() != "#### v${fabricReleaseVersion}-release") {
            throw new GradleException("Missing shared release changelog section for v${fabricReleaseVersion}-release")
        }
        def curseForgeMetadata = cltReadCurseForgeUploadMetadata()
        if (curseForgeMetadata.releaseType != 'release'
                || curseForgeMetadata.changelog != changelog
                || !curseForgeMetadata.gameVersions.containsAll([9990L, 7499L])) {
            throw new GradleException('CurseForge Fabric upload metadata is inconsistent')
        }
        new java.util.zip.ZipFile(cltVerifyPublishArtifactFile()).withCloseable { zip ->
            def metadataEntry = zip.getEntry('fabric.mod.json')
            if (metadataEntry == null) throw new GradleException('Fabric jar has no fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadataEntry))
            if (metadata.id != mod_id || metadata.version != fabricReleaseVersion
                    || metadata.license != 'GPL-3.0-only'
                    || metadata.depends?.create != ">=${mod_create_compat_version}") {
                throw new GradleException('Fabric jar metadata does not match the publish target')
            }
            if (zip.getEntry("LICENSE_${mod_id}") == null) {
                throw new GradleException('Fabric jar is missing its license')
            }
        }
        println "Verified Fabric publication: ${cltReadPublishVersionId()} / ${fabricReleaseVersion}"
    }
}

tasks.named('publishCurseForge') { dependsOn 'verifyFabricRelease' }
tasks.matching { it.name in ['publishMods', 'publishModrinth'] }.configureEach {
    dependsOn 'verifyFabricRelease'
}

tasks.named('jar', Jar) {
    from(new File(cltRepositoryRoot, 'LICENSE')) {
        rename { "LICENSE_${mod_id}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
