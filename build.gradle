plugins {
    id 'base'
}

def versionProjects = [
        ':forge-1.19.2',
        ':forge-1.20.1-0.5.1',
        ':forge-1.20.1-6.0.x',
        ':neoforge-1.21.1'
]

apply from: rootProject.file('gradle/clt-publishing-root.gradle')

tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Build every standalone CreateLazyTick version project.'
    dependsOn(':common:build')
    dependsOn(versionProjects.collect { "${it}:build" })
}

tasks.register('compileJavaAllVersions') {
    group = 'build'
    description = 'Compiles every supported CreateLazyTick version project.'
    dependsOn(versionProjects.collect { "${it}:compileJava" })
}

tasks.register('jarAllVersions') {
    group = 'build'
    description = 'Alias for packageAllVersions; builds loader-correct final jars.'
    dependsOn('packageAllVersions')
}

def clientRunProjects = [
        'runClient-forge-1.19.2'       : ':forge-1.19.2',
        'runClient-forge-1.20.1-0.5.1' : ':forge-1.20.1-0.5.1',
        'runClient-forge-1.20.1-6.0.x' : ':forge-1.20.1-6.0.x',
        'runClient-neoforge-1.21.1'    : ':neoforge-1.21.1'
]

clientRunProjects.each { taskName, projectPath ->
    tasks.register(taskName) {
        group = 'development'
        description = "Runs ${projectPath}:runClient in this Gradle build."
        dependsOn("${projectPath}:runClient")
    }
}
