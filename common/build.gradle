plugins {
    id 'java-library'
}

// `common` is a source/resource fragment for the version projects, not a binary
// dependency.  Keep this project source-empty so aggregate `:common:build`
// remains valid even when shared Java uses Minecraft APIs supplied by children.
sourceSets {
    main {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}
