pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'CreateLazyTick'

include 'common'
include 'forge-1.19.2'
include 'forge-1.20.1-0.5.1'
include 'forge-1.20.1-6.0.x'
include 'neoforge-1.21.1'

project(':common').projectDir = file('common')
project(':forge-1.19.2').projectDir = file('project/forge/1.19.2')
project(':forge-1.20.1-0.5.1').projectDir = file('project/forge/1.20.1-0.5.1')
project(':forge-1.20.1-6.0.x').projectDir = file('project/forge/1.20.1-6.0.x')
project(':neoforge-1.21.1').projectDir = file('project/neoforge/1.21.1')
